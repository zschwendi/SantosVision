name: Sideload data helpers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-helpers:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python scripts/test-prepare-sideload-data.py
